name: check
on:
  pull_request:
  push:
    branches: [main, release-path]
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/check.mjs
      - run: node tools/smoke.mjs
      - run: node tools/feed.mjs
